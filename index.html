<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPCreative Solutions - Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-background">
        <div class="login-box">
            <div class="login-logo">
                <img src="../assets/images/logo-lp.jpg" alt="LP Creative Solutions Logo">
                <h2>LP Creative Solutions</h2>
                <p>Sistema de Gestão</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username"><i class="fas fa-user"></i></label>
                    <input type="text" id="username" name="username" placeholder="Usuário ou Email" required>
                </div>
                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i></label>
                    <input type="password" id="password" name="password" placeholder="Senha" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Entrar</button>
                    <button type="button" class="btn-exit"><i class="fas fa-times"></i> Sair</button>
                </div>
                <div class="form-footer">
                    <a href="#">Esqueceu a senha?</a>
                </div>
            </form>
            <div id="message" style="color: red; margin-top: 10px;"></div>
        </div>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
