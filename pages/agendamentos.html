<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LP Creative Solutions System - Agendamentos</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/main.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.14/main.css" rel="stylesheet" />

    <style>
        /* Estilos adicionais para o calendário e formulário fixo */
        #calendar {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow-light);
        }

        .fc .fc-button-primary {
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
        }
        .fc .fc-button-primary:hover {
            background-color: var(--primary-dark-color) !important;
            border-color: var(--primary-dark-color) !important;
        }

        /* Formulário fixo */
        #formAgendamento {
            max-width: 900px;
            margin: 20px auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow-dark);
        }

        #formAgendamento .input-group label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        #formAgendamento .input-group input,
        #formAgendamento .input-group select,
        #formAgendamento .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            margin-bottom: 15px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        #formAgendamento .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #formAgendamento .btn-secondary {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/logo-lp.jpg" alt="LP Creative Solutions Logo" class="sidebar-logo" />
                <h3>LP Creative Solutions System</h3>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item"><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="nav-item"><a href="clientes.html"><i class="fas fa-users"></i> Clientes e Pets</a></li>
                    <li class="nav-item active"><a href="agendamentos.html"><i class="fas fa-calendar-alt"></i> Agendamentos</a></li>
                    <li class="nav-item"><a href="estoque.html"><i class="fas fa-boxes"></i> Estoque</a></li>
                    <li class="nav-item"><a href="vendas.html"><i class="fas fa-cash-register"></i> Vendas</a></li>
                    <li class="nav-item"><a href="financeiro.html"><i class="fas fa-dollar-sign"></i> Financeiro</a></li>
                    <li class="nav-item"><a href="veterinario.html"><i class="fas fa-user-md"></i> Veterinário</a></li>
                    <li class="nav-item"><a href="configuracoes.html"><i class="fas fa-cog"></i> Configurações</a></li>
                    <li class="nav-item logout-item"><a href="index.html"><i class="fas fa-sign-out-alt"></i> Sair</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="navbar">
                <h1>Agendamentos</h1>
                <div class="user-info">
                    <span class="user-name">Olá, Nome do Usuário!</span>
                </div>
            </header>

            <section class="section-content">
                <div class="card">
                    <div class="card-header">
                        <h2>Calendário de Agendamentos</h2>
                        <button class="btn-primary" id="btnNovoAgendamento">
                            <i class="fas fa-plus"></i> Novo Agendamento
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="calendar"></div>
                    </div>
                </div>

                <!-- Formulário fixo de agendamento -->
                <div class="card" id="formAgendamento" style="display: none;">
                    <div class="card-header">
                        <h2 id="formTitle">Novo Agendamento</h2>
                        <button class="btn-secondary" id="btnVoltarFormulario">
                            <i class="fas fa-arrow-left"></i> Voltar ao calendário
                        </button>
                    </div>
                    <div class="card-body">
                        <form id="appointmentForm" class="appointment-form">
                            <input type="hidden" id="agendamentoId" name="agendamentoId" />
                            
                            <div class="input-group">
                                <label for="inputCliente">Cliente:</label>
                                <input
                                    type="text"
                                    id="inputCliente"
                                    name="inputCliente"
                                    list="listaClientes"
                                    autocomplete="off"
                                    required
                                />
                                <datalist id="listaClientes"></datalist>
                            </div>

                            <div class="input-group">
                                <label for="inputPet">Pet:</label>
                                <input
                                    type="text"
                                    id="inputPet"
                                    name="inputPet"
                                    list="listaPets"
                                    autocomplete="off"
                                    required
                                />
                                <datalist id="listaPets"></datalist>
                            </div>

                            <div class="input-group">
                                <label for="agendamentoServico">Serviço:</label>
                                <select id="agendamentoServico" name="agendamentoServico" required>
                                    <option value="">Selecione o serviço</option>
                                    <option value="banho">Banho</option>
                                    <option value="tosa">Tosa</option>
                                    <option value="consulta">Consulta Veterinária</option>
                                    <option value="vacina">Vacinação</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label for="agendamentoData">Data:</label>
                                <input type="date" id="agendamentoData" name="agendamentoData" required />
                            </div>

                            <div class="input-group">
                                <label for="agendamentoHora">Hora:</label>
                                <input type="time" id="agendamentoHora" name="agendamentoHora" required />
                            </div>

                            <div class="input-group">
                                <label for="agendamentoObservacoes">Observações:</label>
                                <textarea
                                    id="agendamentoObservacoes"
                                    name="agendamentoObservacoes"
                                    rows="3"
                                ></textarea>
                            </div>

                            <button type="submit" class="btn-primary">
                                <i class="fas fa-calendar-plus"></i> Salvar Agendamento
                            </button>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.14/index.global.min.js"></script>
    <script src="../js/agendamentos.js"></script>
</body>
</html>
